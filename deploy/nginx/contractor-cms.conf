server {
    listen 80;
    server_name cms.example.com;
    root /var/www/contractor-cms/public;
    index index.php;
    client_max_body_size 30m;
    # Add TLS before production.
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 65s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known/) { deny all; }
    location ^~ /build/ { expires 1y; add_header Cache-Control "public, immutable"; }
    # Laravel routes also serve stylesheets and scripts under /assets/.
    location ^~ /assets/ { expires 1h; try_files $uri /index.php?$query_string; }
    location ~* ^/(storage|vendor|config|database|resources|\.env)(/|$) { return 404; }
}
