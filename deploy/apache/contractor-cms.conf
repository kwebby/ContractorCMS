<VirtualHost *:80>
    ServerName cms.example.com
    DocumentRoot /var/www/contractor-cms/public
    <Directory /var/www/contractor-cms/public>
        AllowOverride All
        Options -Indexes -MultiViews
        Require all granted
        LimitRequestBody 31457280
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog /var/log/apache2/contractor-cms-error.log
    CustomLog /var/log/apache2/contractor-cms-access.log combined
</VirtualHost>
# Add TLS. Enable mod_rewrite and PHP 8.4+.
# Never point DocumentRoot at the repository root.
